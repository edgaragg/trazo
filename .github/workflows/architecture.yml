name: Architecture

# Runs Trazo on its own pull requests. `uses: ./` runs the Action bundle committed in the pull
# request itself, so this also tests the Action end to end on real GitHub.
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  trazo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Trazo compares against the base revision, so it needs history.
      - uses: ./
